<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="470" viewBox="0 0 1240 470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="none"/>
  </defs>
  <style>
    .ttl { fill: #57606a; font-size: 12px; font-weight: 600; letter-spacing: 2px; }
    .tt  { fill: #1f2328; font-size: 15px; font-weight: 600; }
    .m   { fill: #57606a; font-size: 13px; }
    .num { fill: #1f2328; font-size: 14px; font-weight: 600; }
    .rtf { fill: #57606a; font-size: 13px; }
    .box { fill: #ffffff; stroke: #d0d7de; }
    .grid{ stroke: #d0d7de; stroke-opacity: .5; stroke-dasharray: 3 4; }
  </style>

  <rect x="0" y="0" width="1240" height="470" rx="14" fill="#ffffff" stroke="#d0d7de"/>
  <text x="28" y="34" class="ttl">WHAT 34 SECONDS OF AUDIO COSTS, ON THE CPU</text>
  <text x="28" y="58" class="m">i7-6820HQ, 4 cores / 8 threads, warmed page cache, one 45 s window, no GPU.</text>

  <!-- grid every 10 s -->
  <g class="grid">
    <line x1="370" y1="84" x2="370" y2="352"/>
    <line x1="570" y1="84" x2="570" y2="352"/>
    <line x1="770" y1="84" x2="770" y2="352"/>
    <line x1="970" y1="84" x2="970" y2="352"/>
    <line x1="1170" y1="84" x2="1170" y2="352"/>
  </g>
  <g class="m" font-size="12">
    <text x="270" y="372" text-anchor="middle">0 s</text>
    <text x="470" y="372" text-anchor="middle">10</text>
    <text x="670" y="372" text-anchor="middle">20</text>
    <text x="870" y="372" text-anchor="middle">30</text>
    <text x="1070" y="372" text-anchor="middle">40</text>
  </g>

  <!-- bars -->
  <g>
    <text x="20" y="112" class="tt">Qwen3-ASR 0.6B</text>
    <text x="20" y="130" class="m">Russian, fp32</text>
    <rect x="270" y="94" width="160" height="26" rx="4" fill="#8250df"/>
    <rect x="430" y="94" width="550" height="26" rx="4" fill="#dea584"/>
    <text x="990" y="112" class="num">35.5 s</text>
    <text x="1060" y="112" class="rtf">1.2&#215; real time</text>

    <text x="20" y="162" class="tt">Qwen3-ASR 0.6B</text>
    <text x="20" y="180" class="m">Russian, int4</text>
    <rect x="270" y="144" width="100" height="26" rx="4" fill="#8250df"/>
    <rect x="370" y="144" width="350" height="26" rx="4" fill="#dea584"/>
    <text x="730" y="162" class="num">22.5 s</text>
    <text x="800" y="162" class="rtf">1.9&#215;</text>

    <text x="20" y="212" class="tt">Nemotron 3.5 ASR</text>
    <text x="20" y="230" class="m">40 languages</text>
    <rect x="270" y="194" width="50" height="26" rx="4" fill="#8250df"/>
    <rect x="320" y="194" width="440" height="26" rx="4" fill="#dea584"/>
    <text x="770" y="212" class="num">24.5 s</text>
    <text x="840" y="212" class="rtf">1.5&#215;</text>

    <text x="20" y="262" class="tt">Parakeet TDT v3</text>
    <text x="20" y="280" class="m">English, fp32</text>
    <rect x="270" y="244" width="100" height="26" rx="4" fill="#8250df"/>
    <rect x="370" y="244" width="160" height="26" rx="4" fill="#dea584"/>
    <text x="540" y="262" class="num">13 s</text>
    <text x="610" y="262" class="rtf">4.2&#215;</text>

    <text x="20" y="312" class="tt">Parakeet TDT v3</text>
    <text x="20" y="330" class="m">English, int8</text>
    <rect x="270" y="294" width="100" height="26" rx="4" fill="#8250df"/>
    <rect x="370" y="294" width="140" height="26" rx="4" fill="#dea584"/>
    <text x="520" y="312" class="num">12 s</text>
    <text x="590" y="312" class="rtf">4.8&#215;</text>
  </g>

  <!-- legend -->
  <g>
    <rect x="270" y="336" width="14" height="14" rx="3" fill="#8250df"/>
    <text x="294" y="347" class="m">model load, once per process</text>
    <rect x="480" y="336" width="14" height="14" rx="3" fill="#dea584"/>
    <text x="504" y="347" class="m">transcribe the 33.6 s of audio</text>
    <text x="20" y="347" class="m">&#8220;n&#215; real time&#8221; = audio seconds per wall-clock second.</text>
  </g>

  <!-- donut: where one cold Qwen run goes -->
  <text x="1000" y="120" text-anchor="middle" class="ttl" font-size="12">ONE COLD RUN, SLOWEST MODEL</text>
  <path d="M 1050.0 158.0 A 92 92 0 0 1 1140.9 235.8 L 1107.3 241.1 A 58 58 0 0 0 1050.0 192.0 Z" fill="#8250df" stroke="#ffffff" stroke-width="2"/>
  <path d="M 1140.9 235.8 A 92 92 0 0 1 1141.1 237.4 L 1107.5 242.1 A 58 58 0 0 0 1107.3 241.1 Z" fill="#1a7f37" stroke="#ffffff" stroke-width="2"/>
  <path d="M 1141.1 237.4 A 92 92 0 1 1 1050.0 158.0 L 1050.0 192.0 A 58 58 0 1 0 1107.5 242.1 Z" fill="#dea584" stroke="#ffffff" stroke-width="2"/>
  <text x="1099" y="195" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">8 s</text>
  <text x="1001" y="311" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">27.4 s</text>
  <text x="1050" y="246" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2328">35.5 s</text>
  <text x="1050" y="266" text-anchor="middle" font-size="11" fill="#57606a">total, cold</text>

  <g>
    <rect x="1000" y="330" width="14" height="14" rx="3" fill="#dea584"/>
    <text x="1024" y="341" class="m">inference 27.4 s (77 %)</text>
    <rect x="1000" y="352" width="14" height="14" rx="3" fill="#8250df"/>
    <text x="1024" y="363" class="m">load once 8 s (23 %)</text>
    <rect x="1000" y="374" width="14" height="14" rx="3" fill="#1a7f37"/>
    <text x="1024" y="385" class="m">ffmpeg + DSP 0.1 s (under 1 %)</text>
  </g>

  <text x="1000" y="424" class="m">A batch pays the load once: the second file of the</text>
  <text x="1000" y="442" class="m">same run costs 27.5 s, the load 8 s disappears.</text>
</svg>