[package]
name = "lc-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "Fully-local video → transcript using yt-dlp + ffmpeg + local language-ID and ASR models (Rust port of localcaption)."
repository = "https://github.com/Githab-capibara/lc-rs"
readme = "README.md"
keywords = ["asr", "transcription", "youtube", "onnx", "subtitles"]
categories = ["command-line-utilities", "multimedia::audio"]

[lib]
name = "lc_rs"
path = "src/lib.rs"

[[bin]]
name = "lc-rs"
path = "src/main.rs"

[features]
default = []
# Opt-in GPU execution for the ONNX Runtime sessions.
#
# `cuda` links the CUDA execution provider into ONNX Runtime. `copy-dylibs`
# (an `ort` feature, not a dependency of ours) symlinks the provider
# libraries next to the built binary: ONNX Runtime loads them by looking
# next to the executable, and without them a CUDA-enabled build silently
# runs on the CPU.
#
# The provider itself needs the CUDA 13 runtime on the machine (cudart,
# cublas, curand) and a card in the architectures that runtime still covers:
# the CUDA 13 line dropped Maxwell, so a Quadro M4000M could not use it even
# with the libraries installed. A build that cannot register the provider
# falls back to the CPU per session — see `src/gpu.rs`. CPU execution paths
# are always compiled.
cuda = ["ort/cuda", "ort/copy-dylibs"]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "fs", "process", "time", "io-util", "net"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "socks", "charset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "2"
redb = "4.6"
ort = { version = "2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "api-31", "tls-rustls"] }
rustfft = "6.4"
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
sha2 = "0.10"
url = "2.5"
hex = "0.4"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.test]
opt-level = 0

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
